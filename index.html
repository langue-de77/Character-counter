<!DOCTYPE html>
<html lang="en-US">
<head>

    <meta name="viewport" content="width=device-width">
    <title>文字数カウント</title>
    <link rel="stylesheet" type="text/css" href="./style.css">
    <link rel="icon" href="./img/favicon.ico" sizes="any">
</head>
<body>

    <script src="app.js" defer></script>
